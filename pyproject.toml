[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashkit"
version = "0.1.0"
description = "Lighthouse auditing CLI and terminal dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "python-dotenv>=1.2",
    "rich>=14.3",
    "textual>=7.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "pydeps>=1.12",
    "pytest>=7.0",
    "ruff>=0.14",
    "sphinx>=8.1",
    "vulture>=2.14",
]

[project.scripts]
dashkit = "dashkit.cli:main"

[project.urls]
Issues = "https://github.com/oct-cr/web-audit-tool/issues"
Repository = "https://github.com/oct-cr/web-audit-tool"

[tool.hatch.build.targets.wheel]
packages = ["dashkit"]

[tool.hatch.build.targets.wheel.force-include]
"workspaces/demo.yaml" = "dashkit/workspaces/demo.yaml"

[tool.ruff]
src = ["dashkit"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "B", "SIM", "PIE", "RUF", "C4", "ARG", "ERA", "TCH", "PT"]
ignore = ["ARG001"]
